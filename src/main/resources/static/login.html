<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmbedJNoSQL — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/console.css">
    <style>
        :root {
            --bg-base: #090914;
            --bg-card: rgba(18, 20, 38, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-grad: linear-gradient(135deg, #fbbf24, #f59e0b);
            --accent-glow: rgba(251, 191, 36, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.10) 0%, transparent 60%), #090914;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            filter: drop-shadow(0 8px 24px var(--accent-glow));
        }
        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin: 0 0 6px 0;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin: 0;
        }
        .login-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            background-color: rgba(10, 12, 24, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.88rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            background-color: rgba(15, 18, 35, 0.95);
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
        }
        .form-input::placeholder {
            color: #64748b;
        }
        .btn-submit {
            width: 100%;
            padding: 12px 18px;
            background: var(--accent-grad);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-submit:hover:not(:disabled) {
            opacity: 0.94;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        }
        .btn-submit:focus-visible {
            outline: 2px solid #f59e0b;
            outline-offset: 2px;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            display: none;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .login-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }
        /* Small screens: keep the card comfortable and touch-friendly */
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
        }
        /* Honor the OS reduced-motion preference (card transition, button lift) */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo-wrap">
                <img src="/logo.svg" alt="EmbedJNoSQL logo" width="88" height="88" />
            </div>
            <h1 class="login-title">EmbedJNoSQL Console</h1>
            <p class="login-subtitle">Sign in to manage your embedded database</p>
            <span class="login-badge">Multi-Model NoSQL &bull; Documents &bull; KV &bull; Wide-Column</span>
        </div>

        <div id="errorMessage" class="error-message" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" id="username" name="username" value="admin" autocomplete="username" aria-label="Username" placeholder="e.g. admin">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" aria-label="Password" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label class="form-label" for="apiKey">API Key (Optional)</label>
                <input class="form-input" type="password" id="apiKey" name="apiKey" aria-label="API key, optional" placeholder="Leave blank if disabled">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        </form>

        <div class="login-footer">
            EmbedJNoSQL Embedded NoSQL Database &bull; Secure Console
        </div>
    </div>

    <script src="/js/login.js" defer></script>

</body>
</html>
