<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found — EmbedJNoSQL</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0B0F;
      --card: #12141C;
      --gold: #FBBF24;
      --text: #E7E9EE;
      --text-2: #9AA3B2;
      --line: rgba(251, 191, 36, 0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap {
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 3rem 2rem;
    }
    .badge {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    p {
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      background: var(--gold);
      color: #0A0B0F;
      transition: background 0.2s;
    }
    .btn:hover { background: #fde047; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">404 — Not Found</div>
    <h1>Page Not Found</h1>
    <p>The collection or document you are looking for does not exist in this database.</p>
    <a href="./" class="btn">Return to Overview</a>
  </div>
</body>
</html>
