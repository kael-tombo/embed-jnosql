# Quarkus configuration for EmbedJNoSQL E-Commerce Demo
quarkus.application.name=quarkus-ecommerce-demo
quarkus.http.port=8082
quarkus.http.test-port=8086

# EmbedJNoSQL Configuration
embedjnosql.engine=IN_MEMORY
embedjnosql.data-dir=target/quarkus-data
embedjnosql.auto-flush=true
embedjnosql.flush-interval-ms=1000
