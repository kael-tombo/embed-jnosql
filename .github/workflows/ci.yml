name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are redundant: cancel queued/in-progress ones on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '23']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and Test (with 70% coverage gate)
        # -Pcoverage-check enforces the JaCoCo line-coverage gate (70%).
        # Measured 2026-09: 73.6% line coverage on the full suite.
        run: ./mvnw -B clean verify -Pcoverage-check

      - name: Upload Coverage
        if: matrix.java == '21'
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: target/surefire-reports/

      # Size gate (release audit doc 02): the published core jar must stay
      # under the approved 5 MB lightweight-embedded limit.
      - name: Enforce core jar size limit (5 MB)
        if: matrix.java == '21'
        run: |
          SIZE=$(stat -c %s target/junify-db-core-1.0.0.jar)
          LIMIT=$((5 * 1024 * 1024))
          echo "core jar: ${SIZE} bytes (limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Core jar ${SIZE} bytes exceeds the 5 MB limit (doc 02-size-and-footprint-audit)."
            exit 1
          fi

  # Framework starters and CLI live as separate Maven builds; verify them so the
  # "supported integrations" claim stays CI-tested (release audit CI-04).
  integrations:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Install core
        run: ./mvnw -B clean install -DskipTests

      - name: Verify starter, extension and CLI modules
        # cli/ was repaired in R-25 (pom added, package path corrected) and is
        # verified here like the other modules — see release-audit 53 (R-25).
        run: |
          for module in spring-boot-starter quarkus-extension micronaut-integration cli; do
            echo "::group::Verify $module"
            (cd "$module" && mvn -B verify) || exit 1
            echo "::endgroup::"
          done

  # Supply-chain guard: fail on CVSS >= 9 findings (P2-4). Reports for the rest.
  deps-scan:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: OWASP Dependency-Check (fail on Critical)
        run: >
          mvn -B org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=9
          -DfailOnError=false

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # Demo smoke: the demo suite is the executable proof of the framework-integration
  # claims (release audit CI-04 / docs 35). Runs on pushes to main; core is installed
  # from the same commit the demos run against.
  demos:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Install core and demo-common
        run: |
          ./mvnw -B clean install -DskipTests
          (cd demo/demo-common && mvn -B install -DskipTests)  # runners preinstall mvn; no wrapper in demo-common

      - name: Install starter modules (needed by framework demos)
        # spring-boot-demo, quarkus-demo and micronaut-demo resolve junify starter
        # artifacts that exist in no public repository — they must be installed
        # locally before the demo loop. Mirrors the integrations job's module list.
        run: |
          for module in spring-boot-starter quarkus-extension micronaut-integration; do
            (cd "$module" && mvn -B install -DskipTests) || exit 1
          done

      - name: Run all demo test suites
        run: |
          failed=""
          for d in spring-boot-demo quarkus-demo micronaut-demo vertx-demo \
                   end-to-end-validation advanced-queries-demo \
                   annotation-showcase-demo batch-processing-demo \
                   load-and-stress-demo; do
            echo "::group::Demo $d"
            if (cd "demo/$d" && mvn -B clean test); then
              echo "::notice title=Demo $d::PASSED"
            else
              echo "::error title=Demo $d failed::mvn clean test exited non-zero; see the group above for the surefire failure summary"
              failed="$failed $d"
            fi
            echo "::endgroup::"
          done
          # Surface every failing demo's surefire summary as a public annotation
          for d in $failed; do
            grep -h -A 6 "<<< FAILURE\!\|<<< ERROR\!" "demo/$d/target/surefire-reports"/*.txt 2>/dev/null | head -40 | sed "s/^/[$d] /" || true
          done
          [ -z "$failed" ] || { echo "Failing demos:$failed"; exit 1; }

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run Benchmarks
        run: mvn -B -Pbenchmark clean package exec:java -Dexec.mainClass=org.junify.db.benchmark.BenchmarkRunner

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/benchmark-results.json

  # Console contract gate (R-34..R-41 follow-up): boots the real server from the
  # built jar and fails on any non-2xx response, dropped connection, or lying
  # response body from a path the console UI calls. Three rounds of live probing
  # found endpoints that returned HTTP 200 while doing nothing (empty backups,
  # starved CDC connectors, a mirrored "Subscribers" KPI) or destroyed data (an
  # index route that called clear()); a unit suite does not catch that class,
  # a behaviour probe does. The gate was falsified against the pre-fix commit
  # (10 failures, incl. the data-loss check) and passes on the fixed tree.
  console-contract:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Package jar
        run: ./mvnw -B -DskipTests package

      - name: Run console contract gate (unauthenticated surface)
        run: |
          bash scripts/console-contract-gate.sh 8097
          ENGINE=LSM_TREE bash scripts/console-contract-gate.sh 8097
          ENGINE=B_TREE bash scripts/console-contract-gate.sh 8097

      - name: Run console auth gate (enforcement + session lifecycle)
        run: bash scripts/console-auth-gate.sh 8098

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-gate-server-log
          path: |
            target/contract-gate-server.log
            target/contract-auth-gate-server.log
