name: Publish to Maven Central

on:
  # Trigger on a version tag push: git tag v1.0.1 && git push origin v1.0.1
  push:
    tags:
      - 'v*.*.*'
  # Allow manual dispatch for one-off releases
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & verify the core module first
  # ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Verify Core (943 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run core tests
        run: mvn -B verify -DskipTests=false

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Verify Spring Boot Starter (78 tests)
  # ─────────────────────────────────────────────────────────────────────────────
  test-starter:
    name: Verify Spring Boot Starter (78 tests)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install core to local repo
        run: mvn -B install -DskipTests
      - name: Run starter tests
        run: mvn -B -f spring-boot-starter/pom.xml test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Publish BOTH artifacts to Maven Central
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [test-core, test-starter]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 with Maven Central settings
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          # This populates ~/.m2/settings.xml with the <server id="central"> entry
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD

      # ── Import GPG key ────────────────────────────────────────────────────
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      # ── Publish embed-jnosql-core ─────────────────────────────────────────
      - name: Deploy embed-jnosql-core
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -P maven-central -DskipTests \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"

      # ── Install core locally (needed for starter compile) ─────────────────
      - name: Install core locally (for starter build)
        run: mvn -B install -DskipTests

      # ── Publish embed-jnosql-spring-boot-starter ──────────────────────────
      - name: Deploy embed-jnosql-spring-boot-starter
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -f spring-boot-starter/pom.xml deploy -P maven-central -DskipTests \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"

      - name: Summary
        run: |
          echo "## ✅ Published to Maven Central" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`org.embeddedjnosql.db:embed-jnosql-core\` | \`$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`org.embeddedjnosql.db:embed-jnosql-spring-boot-starter\` | \`1.0.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View on Central: https://central.sonatype.com/search?q=embeddedjnosql" >> $GITHUB_STEP_SUMMARY
